name: Telegram Alpha Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-tg.yml
      - scripts/**
      - site/index.html
      - site/app.js
      - site/styles.css
      - public-data-start.txt
  schedule:
    - cron: '57 1,5,9,13,17,21 * * *'
      timezone: Asia/Shanghai

concurrency:
  group: alpha-monitor-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout current data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test TG pipeline
        run: |
          node scripts/test-telegram-history.mjs
          node scripts/test-tg-pipeline.mjs
          node scripts/test-site-tg-ui.mjs
      - name: Collect every message since the checkpoint
        run: node scripts/update-telegram.mjs
      - name: Rebuild website
        run: node scripts/build-site.mjs
      - name: Save public source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- collection-state.json snapshots/ telegram_project_counts.csv avatar_cache.csv reports/ data.json site/data.json index.html app.js styles.css
          if ! git diff --cached --quiet; then
            git commit -m 'Update Telegram project records'
            git push origin HEAD:main
          fi
      - name: Package public website only
        run: node scripts/prepare-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: [update, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout published data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Verify live website matches committed data
        run: node scripts/verify-public-sync.mjs
